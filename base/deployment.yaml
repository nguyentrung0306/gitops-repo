apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-service
  template:
    metadata:
      labels:
        app: app-service
    spec:
      containers:
        - name: app-service
          image: trungnd01/app-service:ef0885e6032135dc2dab83812d2030a705953a76
          ports:
            - containerPort: 8080
