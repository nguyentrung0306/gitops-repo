apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nguyentrung0306/gitops-repo.git
    targetRevision: main
    path: my-service/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
